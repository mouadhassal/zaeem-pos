[package]
name = "app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# Adding src/bin/license_signer.rs gave this crate two binaries, so bare
# `cargo run` (what `tauri dev` invokes) could no longer infer which one to
# run. `license_signer` stays reachable via `cargo run --bin license_signer`.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled", "trace"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = "0.4"
bcrypt = "0.15"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"
tokio = { version = "1.53.0", features = ["time", "net", "rt-multi-thread", "macros", "sync"] }
license-core = { path = "../../../packages/license-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# 2026-07-27: menu onboarding's real AiProvider (ai/remote.rs) base64-encodes
# a photo/PDF before proxying it to the ai-menu-extract edge function.
base64 = "0.22"
async-trait = "0.1"
# LAN hub/satellite (branch-local, offline-resilient multi-terminal sync --
# see lan.rs's module doc for the full design). axum reuses the tokio
# runtime tauri already starts; mdns-sd is what lets a satellite terminal
# find the branch's Hub with zero typing, same mechanism as AirPlay/
# Chromecast discovery.
axum = { version = "0.7", features = ["ws"] }
mdns-sd = "0.11"
# 2026-07-26 printer audit: USB printing previously relied on browser
# WebUSB (navigator.usb), which Tauri's embedded webview does not
# implement -- it silently never worked. `printers` wraps the real OS
# print spooler (winspool on Windows, CUPS on Linux/macOS) so a raw
# ESC/POS byte buffer reaches actual USB-attached hardware through the
# OS's own driver, the same path any other installed printer uses.
printers = "2.3.0"
# 2026-07-27, shipping day: silent auto-update. `updater` checks a signed
# manifest (see the new /api/updates route in apps/control) and installs
# in the background; `process` provides `relaunch()` so the new version
# takes effect on the next natural app restart without any manual
# reinstall by the customer or the reseller.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["time", "macros", "rt-multi-thread"] }
