[package]
# Vendored copy of ../../packages/license-core (monorepo root). This repo
# (apps/zaeem-pos) has its own separate git history/remote and gets checked
# out standalone in CI, so a `path = "../../../packages/..."` dependency
# reaching outside this repo's boundary can never resolve there -- that was
# the real cause of the macOS CI build failing at the cargo-build step (it
# got past `pnpm install`, which doesn't touch Cargo deps, and only failed
# once cargo actually tried to resolve this path). Keep this in sync with
# the root copy by hand if signed.rs/fingerprint.rs/b64.rs change --
# services/license-signer still depends on the root copy directly.
name = "license-core"
version = "0.1.0"
edition = "2021"
description = "Shared Ed25519 license payload, signing, and verification logic -- used by the zaeem-pos app (verify) and the license-signer service (sign), so they can never disagree on serialization."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"
