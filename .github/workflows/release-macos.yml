name: macOS build

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    strategy:
      matrix:
        # Built separately per-arch, not as a universal binary: Tauri's
        # universal-apple-darwin build only lipo's the main "app" binary,
        # not this package's second cargo bin target (license_signer),
        # which then fails the bundling step looking for it under
        # target/universal-apple-darwin/release/. Per-arch builds don't
        # hit that since there's no lipo merge step.
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-target-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build app
        # createUpdaterArtifacts (tauri.conf.json) is for the Windows
        # auto-update flow and needs TAURI_SIGNING_PRIVATE_KEY, which this
        # test build doesn't have/need -- overridden off here only, not in
        # the checked-in config, so Windows builds are unaffected.
        run: pnpm tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: wenzdes-pos-macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
